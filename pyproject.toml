[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellwatch"
version = "0.1.1"
description = "See exactly which variables a Jupyter cell created, changed or deleted."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "NATHANAEL George Steindhart" },
    { name = "SETIAWAN Matthew Henson" },
    { name = "LATHIF Muhammad Akmal" },
    { name = "HANDAYA Clement Steward" },
    { name = "KWAN Kendrick Matthew" },
]
keywords = ["jupyter", "ipython", "notebook", "variables", "diff", "education"]
classifiers = [
    "Framework :: IPython",
    "Framework :: Jupyter",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Education",
]
dependencies = ["ipython>=7.0"]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Geoeoeo217/cellwatch"
Documentation = "https://github.com/Geoeoeo217/cellwatch#readme"
Issues = "https://github.com/Geoeoeo217/cellwatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cellwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
